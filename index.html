<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube ke MP3</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1d1d1b;
    --muted: #6b6a66;
    --line: #e4e2dc;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --accent-soft: #e3f0ec;
    --danger: #b3261e;
    --danger-soft: #fbe9e7;
    --warn-soft: #f4efe1;
    --bar: #e9e7e1;
    --focus: #1f6f5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614;
      --card: #1e201d;
      --ink: #ecebe6;
      --muted: #a09f99;
      --line: #32352f;
      --accent: #5fbfa4;
      --accent-ink: #0d1f1a;
      --accent-soft: #1d3530;
      --danger: #f2a49d;
      --danger-soft: #3a2220;
      --warn-soft: #34301f;
      --bar: #2c2f2a;
      --focus: #5fbfa4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .sub code { font-size: .9em; background: var(--card); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; word-break: break-all; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  textarea {
    width: 100%; min-height: 140px; resize: vertical;
    font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  textarea::placeholder { color: var(--muted); }
  .count { color: var(--muted); font-size: .875rem; margin: 6px 2px 12px; min-height: 1.3em; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .spacer { flex: 1; }
  label.opt { display: inline-flex; gap: 6px; align-items: center; font-size: .925rem; }
  select {
    font: inherit; font-size: .925rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  button {
    font: inherit; font-size: .925rem; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 9px; padding: 8px 14px; min-height: 38px;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.small { padding: 5px 10px; min-height: 32px; font-size: .85rem; }
  button.link { border: 0; background: none; color: var(--muted); padding: 6px 8px; }
  button.link:hover { color: var(--ink); }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; color: var(--accent-ink); background: var(--accent); border-radius: 9px; padding: 5px 10px; font-size: .85rem; font-weight: 600; min-height: 32px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .qhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 32px 0 10px; }
  .qhead h2 { font-size: 1.1rem; margin: 0; }
  .summary { color: var(--muted); font-size: .9rem; }

  ul.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .job { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
  .thumb { width: 112px; aspect-ratio: 16/9; border-radius: 8px; background: var(--bar); object-fit: cover; display: block; }
  .info { min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .url { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; font-size: .875rem; }
  .chip { border-radius: 999px; padding: 1px 9px; font-size: .8rem; font-weight: 600; background: var(--bar); color: var(--muted); }
  .chip.proses { background: var(--accent-soft); color: var(--accent); }
  .chip.selesai { background: var(--accent); color: var(--accent-ink); }
  .chip.ada { background: var(--warn-soft); color: var(--ink); }
  .chip.gagal { background: var(--danger-soft); color: var(--danger); }
  .err { color: var(--danger); font-size: .825rem; margin-top: 4px; overflow-wrap: anywhere; }
  .bar { height: 6px; background: var(--bar); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .bar.indet > span { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .files { font-size: .825rem; color: var(--muted); margin-top: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 16px; border: 1px dashed var(--line); border-radius: 14px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }
  .offline { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: none; }

  @media (max-width: 520px) {
    main { padding-top: 20px; }
    .job { grid-template-columns: 80px 1fr; gap: 10px; }
    .thumb { width: 80px; }
    .row .spacer { display: none; }
    button.primary { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar > span { transition: none; }
    .bar.indet > span { animation: none; width: 100%; opacity: .5; }
  }
</style>
</head>
<body>
<main>
  <h1>YouTube ke MP3</h1>
  <p class="sub">Tempel link, satu per baris. Diunduh satu per satu ke <code id="outdir">…</code></p>

  <div class="offline" id="offline">Server ytmp3-web tidak merespons. Jalankan lagi <code>ytmp3-web</code> di terminal.</div>

  <form class="card" id="form">
    <textarea id="links" spellcheck="false" aria-label="Link YouTube"
      placeholder="https://www.youtube.com/watch?v=…&#10;https://youtu.be/…&#10;&#10;Boleh bernomor atau ada judulnya, link-nya tetap terbaca."></textarea>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="row">
      <label class="opt">Kualitas
        <select id="quality">
          <option value="0">Terbaik</option>
          <option value="320K">320 kbps</option>
          <option value="192K">192 kbps</option>
          <option value="128K">128 kbps (file kecil)</option>
        </select>
      </label>
      <label class="opt"><input type="checkbox" id="playlist"> Seluruh playlist</label>
      <span class="spacer"></span>
      <button type="button" id="paste" hidden>Tempel</button>
      <button type="submit" class="primary" id="submit" disabled>Unduh</button>
    </div>
  </form>

  <div class="qhead">
    <h2>Antrean</h2>
    <span class="summary" id="summary"></span>
    <span class="spacer"></span>
    <button type="button" class="link" id="openFolder" hidden>Buka folder</button>
    <button type="button" class="link" id="clear" hidden>Bersihkan yang selesai</button>
  </div>
  <ul class="jobs" id="jobs"></ul>
  <p class="empty" id="empty">Belum ada unduhan. Link yang kamu tempel akan muncul di sini.</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const LINK_RE = /(?:https?:\/\/)?(?:www\.|m\.|music\.)?(?:youtube\.com|youtu\.be)\/[^\s"'<>]+/g;
const $ = (id) => document.getElementById(id);
const els = new Map();   // id job -> elemen <li>
let lastOrder = "";
let timer = null;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove("show"), 2800);
}

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

// --- form ---------------------------------------------------------------
function foundLinks() {
  return [...new Set($("links").value.match(LINK_RE) || [])];
}
function updateCount() {
  const n = foundLinks().length;
  const raw = $("links").value.trim();
  $("count").textContent = n ? `${n} link YouTube terdeteksi`
    : raw ? "Belum ada link YouTube yang dikenali" : "";
  $("submit").disabled = n === 0;
  $("submit").textContent = n > 1 ? `Unduh ${n} link` : "Unduh";
}
$("links").addEventListener("input", updateCount);
$("links").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("form").requestSubmit();
});

if (navigator.clipboard && navigator.clipboard.readText) {
  $("paste").hidden = false;
  $("paste").addEventListener("click", async () => {
    try {
      const text = await navigator.clipboard.readText();
      const ta = $("links");
      ta.value = ta.value.trim() ? ta.value.replace(/\s*$/, "\n") + text : text;
      updateCount();
      ta.focus();
    } catch { toast("Browser tidak mengizinkan membaca clipboard. Tempel dengan Ctrl+V."); }
  });
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!foundLinks().length) return;
  $("submit").disabled = true;
  try {
    const r = await api("/api/jobs", {
      text: $("links").value,
      quality: $("quality").value,
      playlist: $("playlist").checked,
    });
    let msg = `${r.added} link masuk antrean`;
    if (r.dupes) msg += `, ${r.dupes} sudah ada di antrean`;
    toast(msg);
    $("links").value = "";
    updateCount();
    refresh();
  } catch (err) {
    toast("Gagal: " + err.message);
    updateCount();
  }
});

// --- antrean ------------------------------------------------------------
const LABEL = {
  antre: "Menunggu", proses: "Mengunduh", selesai: "Selesai",
  ada: "Sudah pernah diunduh", gagal: "Gagal", batal: "Dibatalkan",
};

function button(text, cls, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "small " + (cls || "");
  b.textContent = text;
  b.addEventListener("click", onClick);
  return b;
}

function act(path, body, msg) {
  return async () => {
    try { await api(path, body || {}); if (msg) toast(msg); refresh(); }
    catch (err) { toast("Gagal: " + err.message); }
  };
}

function buildJob(job) {
  const li = document.createElement("li");
  li.className = "card job";
  li.innerHTML = `
    <img class="thumb" alt="" loading="lazy">
    <div class="info">
      <div class="title"></div>
      <div class="url"></div>
      <div class="status"><span class="chip"></span><span class="detail"></span></div>
      <div class="bar" hidden><span></span></div>
      <div class="err" hidden></div>
      <div class="files" hidden></div>
      <div class="actions"></div>
    </div>`;
  return li;
}

function updateJob(li, job) {
  const q = (s) => li.querySelector(s);
  const img = q(".thumb");
  const thumb = job.video_id ? `https://i.ytimg.com/vi/${encodeURIComponent(job.video_id)}/mqdefault.jpg` : "";
  if (img.dataset.src !== thumb) { img.dataset.src = thumb; if (thumb) img.src = thumb; else img.removeAttribute("src"); }

  const active = job.status === "antre" || job.status === "proses";
  const title = job.title || (job.playlist ? "Playlist" : active ? "Mengambil judul…" : job.url);
  q(".title").textContent = title;
  q(".url").textContent = job.url;
  q(".url").hidden = title === job.url;

  const chip = q(".chip");
  chip.className = "chip " + job.status;
  chip.textContent = job.status === "proses" && job.phase === "konversi" ? "Mengonversi" : LABEL[job.status];

  let detail = "";
  if (job.status === "proses" && job.phase !== "konversi") detail = `${Math.floor(job.progress)}%`;
  if (job.files.length > 1) detail = `${job.files.length} file`;
  q(".detail").textContent = detail;

  const bar = q(".bar");
  bar.hidden = job.status !== "proses";
  bar.classList.toggle("indet", job.phase === "konversi");
  bar.firstElementChild.style.width = `${job.progress}%`;

  q(".err").hidden = !job.error;
  q(".err").textContent = job.error;

  // Tombol hanya dibuat ulang saat status berubah, supaya tidak hilang saat diklik.
  const key = job.status + ":" + job.files.length;
  if (li.dataset.key === key) return;
  li.dataset.key = key;
  const actions = q(".actions");
  actions.replaceChildren();
  const files = q(".files");
  files.hidden = true;

  if (job.status === "selesai") {
    job.files.slice(0, job.files.length === 1 ? 1 : 0).forEach((name, i) => {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = `/api/file/${job.id}/${i}`;
      a.textContent = "Simpan MP3";
      a.setAttribute("download", name);
      actions.append(a);
    });
    if (job.files.length > 1) { files.hidden = false; files.textContent = "Tersimpan di folder playlist di laptop."; }
    else { files.hidden = false; files.textContent = job.files[0]; }
  }
  if (job.status === "antre" || job.status === "proses")
    actions.append(button("Batal", "", act(`/api/jobs/${job.id}/cancel`)));
  if (job.status === "gagal" || job.status === "batal")
    actions.append(button("Coba lagi", "", act(`/api/jobs/${job.id}/retry`, { force: false }, "Masuk antrean lagi")));
  if (job.status === "ada")
    actions.append(button("Unduh ulang", "", act(`/api/jobs/${job.id}/retry`, { force: true }, "Diunduh ulang")));
}

function render(data) {
  $("outdir").textContent = data.out_dir;
  $("openFolder").hidden = !data.local;
  const list = $("jobs");
  const seen = new Set();
  for (const job of data.jobs) {
    let li = els.get(job.id);
    if (!li) { li = buildJob(job); els.set(job.id, li); }
    updateJob(li, job);
    seen.add(job.id);
  }
  for (const [id, li] of els) if (!seen.has(id)) { li.remove(); els.delete(id); }
  const order = data.jobs.map((j) => j.id).join(",");
  if (order !== lastOrder) {
    lastOrder = order;
    list.replaceChildren(...data.jobs.map((j) => els.get(j.id)));
  }

  const c = {};
  for (const j of data.jobs) c[j.status] = (c[j.status] || 0) + 1;
  const parts = [];
  if (c.proses) parts.push("1 sedang diunduh");
  if (c.antre) parts.push(`${c.antre} menunggu`);
  if (c.selesai) parts.push(`${c.selesai} selesai`);
  if (c.ada) parts.push(`${c.ada} dilewati`);
  if (c.gagal) parts.push(`${c.gagal} gagal`);
  $("summary").textContent = parts.join(" · ");
  $("empty").hidden = data.jobs.length > 0;
  $("clear").hidden = !data.jobs.some((j) => !["antre", "proses"].includes(j.status));
  return Boolean(c.proses || c.antre);
}

async function refresh() {
  clearTimeout(timer);
  let busy = false;
  try {
    busy = render(await api("/api/jobs"));
    $("offline").style.display = "none";
  } catch {
    $("offline").style.display = "block";
  }
  timer = setTimeout(refresh, busy ? 800 : 4000);
}

$("clear").addEventListener("click", act("/api/clear"));
$("openFolder").addEventListener("click", act("/api/open-folder"));
updateCount();
refresh();
</script>
</body>
</html>
